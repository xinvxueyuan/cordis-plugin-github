# Bundle patch for @xinvxueyuan/cordis-plugin-github.
# Applied by `plugin_manager install_bundle` (or any bundle layer that selects
# this bundle); `id` is the Loader entry id and `name` is this package.
# `inject` mirrors the hard dependencies declared in src/index.ts: the official
# service nodes this plugin cannot work without.
- insert:
    - id: github
      name: '@xinvxueyuan/cordis-plugin-github'
      inject: [tools]
      config:
        mode: auto
